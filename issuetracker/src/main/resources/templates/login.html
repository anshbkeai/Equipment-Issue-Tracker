<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
        }

        .login-card {
            border: none;
            border-radius: 15px;
        }

        .brand {
            font-weight: 700;
            font-size: 22px;
        }

        .social-btn {
            width: 100%;
            margin-bottom: 10px;
        }

        .google-btn {
            background: #db4437;
            color: white;
        }

        .github-btn {
            background: #24292e;
            color: white;
        }

        .google-btn:hover,
        .github-btn:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>

<body>

<!-- Top Nav -->
<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="brand">Contact Manager</span>
    <a class="btn btn-outline-primary btn-sm" th:href="@{/home}">Home</a>
</nav>

<!-- Login Container -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 420px;">

        <h3 class="text-center mb-3">Welcome Back</h3>
        <p class="text-center text-muted mb-4">Please login to continue</p>

        <!-- Error -->
        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username and password.
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>

        </form>

        <hr class="my-4">

        <!-- OAuth -->
        <a th:href="@{/oauth2/authorization/google}" class="btn google-btn social-btn">
            Continue with Google
        </a>

        <a href="/oauth2/authorization/github" class="btn github-btn social-btn">
            Continue with GitHub
        </a>

        <!-- Logout -->
        <form action="/logout" method="post" class="mt-3">
            <button type="submit" class="btn btn-outline-danger w-100">
                Logout
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/dashboard">Go to Dashboard</a>
        </div>

    </div>

</div>

</body>
</html>
