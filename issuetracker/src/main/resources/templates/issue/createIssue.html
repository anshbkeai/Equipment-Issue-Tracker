<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Issue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- TOP BAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Issue Tracker</span>

    <a th:href="@{'/issues/part/' + ${issueForm.partId}}"
       class="btn btn-outline-light btn-sm">
        ← Back to Issues
    </a>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Create New Issue</h5>
                </div>

                <div class="card-body">

                    <form th:action="@{/issues}" method="post" th:object="${issueForm}">

                        <!-- PART ID (READONLY) -->
                        <div class="mb-3">
                            <label class="form-label">Part ID</label>
                            <input type="text"
                                   class="form-control bg-light"
                                   th:field="*{partId}"
                                   readonly />
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="mb-3">
                            <label class="form-label">Issue Description</label>
                            <textarea class="form-control"
                                      rows="5"
                                      th:field="*{description}"
                                      placeholder="Describe the issue clearly..."
                                      required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Create Issue
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
