<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Issues</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- TOP NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Issue Tracker</span>

    <div class="d-flex gap-2">

        <!-- BACK TO PARTS -->
        <a th:href="@{/part}" class="btn btn-outline-light btn-sm">
            ← Parts
        </a>

        <!-- CREATE ISSUE -->
        <a class="btn btn-primary btn-sm"
           th:href="@{'/issues/create/' + ${partId}}">
            + New Issue
        </a>

    </div>
</nav>

<div class="container mt-4">

    <!-- HEADER CARD -->
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">

            <div>
                <h5 class="mb-0">Issues</h5>
                <small class="text-muted">Part ID: <span th:text="${partId}"></span></small>
            </div>

        </div>
    </div>

    <!-- TABLE CARD -->
    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark">
                <tr>
                    <th>Issue ID</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Created By</th>
                    <th width="220">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="issue : ${issues}">

                    <td class="text-muted small" th:text="${issue.issueId}"></td>

                    <td th:text="${issue.description}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${
                                  issue.status.name() == 'OPENED' ? 'bg-danger' :
                                  issue.status.name() == 'IN_PROGRESS' ? 'bg-warning text-dark' :
                                  'bg-success'
                              }"
                              th:text="${issue.status}">
                        </span>
                    </td>

                    <td th:text="${issue.createdByUser}"></td>

                    <td >

                        <div sec:authorize="hasRole('ADMIN')">
                            <form th:action="@{'/issues/' + ${issue.issueId} + '/status'}"
                              method="post"
                              class="d-flex gap-2">

                            <input type="hidden" name="partId" th:value="${partId}" />

                            <select name="status" class="form-select form-select-sm">

                                <option th:each="s : ${T(com.anshbkeai.issuetracker.issuetracker.model.IssueStatus).values()}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>

                            </select>

                            <button class="btn btn-sm btn-warning" sec:authorize="hasRole('ADMIN')">
                                Update
                            </button>

                        </form>

                        </div>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
