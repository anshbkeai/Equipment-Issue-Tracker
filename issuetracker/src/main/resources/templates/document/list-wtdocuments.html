<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Documents List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; border-radius: 15px; }
    </style>
</head>

<body>

<div class="container py-5">

    <a th:href="@{'/part'}" class="btn btn-outline-secondary mb-3">
        ← Back to Parts
    </a>

    <div class="card shadow-sm p-4">

        <h3 class="mb-3">Documents for Part: <span th:text="${partId}"></span></h3>

        <table class="table table-striped">

            <thead>
            <tr>
                <th>Document ID</th>
                <th>URL</th>
                <th>Created</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="doc : ${documents}">

                <td th:text="${doc.documentId}"></td>

                <td>
                    <a th:href="${doc.docUrl}" target="_blank">
                        Open
                    </a>
                </td>

                <td th:text="${doc.dateCreated}"></td>

                <td>
                    <a th:href="@{'/wtdocument/view/' + ${doc.documentId}}"
                       class="btn btn-sm btn-primary">
                        View
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
