<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .label {
            font-size: 12px;
            color: #6c757d;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <!-- Back Button -->
    <a href="/part" class="btn btn-outline-secondary mb-3">
        ← Back
    </a>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm p-4">

                <h3 class="mb-4">Create WTD Document</h3>

                <!-- Form -->
                <form th:action="@{/wtdocument/create}" th:object="${wtdocument}" method="post">

                    <!-- Document URL -->
                    <div class="mb-3">
                        <div class="label">Document URL</div>
                        <input type="text"
                               class="form-control"
                               th:field="*{docUrl}"
                               required
                               placeholder="https://example.com/document">

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('docUrl')}"
                             th:errors="*{docUrl}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="label">Document Name</div>
                        <input type="text"
                               class="form-control"
                               th:field="*{documentName}"
                               required
                               placeholder="Document Name">

                        
                    </div>

                    <!-- WT Part ID -->
                    <div class="mb-3">
                        <div class="label">WT Part ID</div>
                        <input type="text"
                                class="form-control"
                                th:field="*{wtpartId}"
                                readonly>

                        <div class="text-danger mt-1"
                             th:if="${#fields.hasErrors('wtpartId')}"
                             th:errors="*{wtpartId}">
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2 mt-4">

                        <button type="submit" class="btn btn-primary">
                            Create
                        </button>

                        <a href="/part" class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
