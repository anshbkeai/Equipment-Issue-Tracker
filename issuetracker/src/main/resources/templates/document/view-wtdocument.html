<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; border-radius: 15px; }
        .label { font-size: 12px; color: #6c757d; }
        .value { font-size: 18px; font-weight: 600; }
    </style>
</head>

<body>

<div class="container py-5">

    <a th:href="@{'/part'}" class="btn btn-outline-secondary mb-3">
        ← Back
    </a>

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm p-4">

                <h3 class="mb-4">Document Details</h3>

                <div class="mb-3">
                    <div class="label">Document ID</div>
                    <div class="value" th:text="${document.documentId}"></div>
                </div>

                <div class="mb-3">
                    <div class="label">Document URL</div>
                    <div class="value">
                        <a th:href="${document.docUrl}" target="_blank"
                           th:text="${document.docUrl}">
                        </a>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="label">WT Part ID</div>
                    <div class="value" th:text="${document.wtPart.partId}"></div>
                </div>

                <div class="mb-3">
                    <div class="label">Created</div>
                    <div class="value" th:text="${document.dateCreated}"></div>
                </div>

                <div class="mb-3">
                    <div class="label">Updated</div>
                    <div class="value" th:text="${document.dateUpdated}"></div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
