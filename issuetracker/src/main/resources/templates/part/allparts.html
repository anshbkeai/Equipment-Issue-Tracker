<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parts Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #eee;
        }

        .part-card {
            border: none;
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .part-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .muted-label {
            font-size: 12px;
            color: #6c757d;
        }

        .value {
            font-weight: 600;
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar topbar px-4 py-3">
    <div class="d-flex align-items-center gap-3">

        <a href="/dashboard" class="btn btn-outline-secondary btn-sm">
            ← Dashboard
        </a>

        <h5 class="mb-0 fw-bold">Parts</h5>
    </div>

    <a href="/part/create" class="btn btn-primary btn-sm">
        + Create Part
    </a>
</nav>

<div class="container py-4">

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(parts)}"
         class="alert alert-warning shadow-sm">
        No parts found. Create your first part to get started.
    </div>

    <!-- GRID -->
    <div class="row g-4">

        <div class="col-md-4" th:each="part : ${parts}">

            <div class="card part-card shadow-sm h-100">

                <div class="card-body">

                    <div class="mb-3">
                        <div class="muted-label">PART ID</div>
                        <div class="value" th:text="${part.partId}"></div>
                    </div>

                    <div class="mb-3">
                        <div class="muted-label">NAME</div>
                        <div class="value" th:text="${part.partName}"></div>
                    </div>

                    <div class="mb-3">
                        <div class="muted-label">DESCRIPTION</div>
                        <div class="text-muted small"
                             th:text="${part.partDescription}">
                        </div>
                    </div>

                    <hr>

                    <!-- ACTIONS -->
                    <div class="d-flex justify-content-between">

                        <a th:href="@{'/part/info/' + ${part.partId}}"
                           class="btn btn-sm btn-outline-dark">
                            View
                        </a>

                        <a th:href="@{'/issues/part/' + ${part.partId}}"
                           class="btn btn-sm btn-primary">
                            Issues →
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
