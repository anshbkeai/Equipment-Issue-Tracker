<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .part-card {
            border: none;
            border-radius: 12px;
            transition: 0.2s ease-in-out;
        }
        .part-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Parts List</h2>
        <a href="/part/create" class="btn btn-primary">
            + Create Part
        </a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(parts)}" class="alert alert-warning">
        No parts available. Click "Create Part" to add one.
    </div>

    <!-- Parts grid -->
    <div class="row g-3">

        <div class="col-md-4" th:each="part : ${parts}">
            <div class="card part-card shadow-sm p-3">

                <div class="card-body">

                    <h6 class="text-muted mb-1">Part ID</h6>
                    <h5 class="fw-bold" th:text="${part.partId}"></h5>

                    <h6 class="text-muted mt-3 mb-1">Name</h6>
                    <h5 th:text="${part.partName}"></h5>

                    <h6 class="text-muted mt-3 mb-1">Description</h6>
                    <p class="mb-0 text-secondary" th:text="${part.partDescription}"></p>

                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
