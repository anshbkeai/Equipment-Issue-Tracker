<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fb;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-size: 12px;
            color: #6c757d;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
        }

        .card {
            border: none;
            border-radius: 14px;
        }

        .action-btn {
            min-width: 140px;
        }
    </style>
</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar topbar px-4 py-3">
    <div class="d-flex align-items-center gap-3">

        <a href="/part" class="btn btn-outline-secondary btn-sm">
            ← Parts
        </a>

        <h5 class="mb-0 fw-bold">Part Details</h5>

        <span class="badge bg-dark" th:text="${part.partId}"></span>
    </div>
</nav>

<div class="container py-4">

    <!-- ERROR STATE -->
    <div th:if="${part == null}" class="alert alert-danger shadow-sm">
        Part not found
    </div>

    <!-- MAIN CONTENT -->
    <div th:if="${part != null}" class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm p-4">

                <!-- HEADER -->
                <div class="mb-4">
                    <h4 class="fw-bold" th:text="${part.partName}"></h4>
                    <p class="text-muted mb-0" th:text="${part.partDescription}"></p>
                </div>

                <hr>

                <!-- INFO GRID -->
                <div class="row g-3">

                    <div class="col-md-6">
                        <div class="info-label">PART ID</div>
                        <div class="info-value" th:text="${part.partId}"></div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-label">CREATED BY</div>
                        <div class="info-value" th:text="${part.partCreatedBy}"></div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-label">DATE CREATED</div>
                        <div class="info-value" th:text="${part.dateCreated}"></div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-label">LAST UPDATED</div>
                        <div class="info-value" th:text="${part.dateUpdated}"></div>
                    </div>

                </div>

                <hr class="my-4">

                <!-- ACTIONS -->
                <div class="d-flex flex-wrap gap-2">

                    <a th:href="@{'/part/edit/' + ${part.partId}}"
                       class="btn btn-warning action-btn">
                        Edit Part
                    </a>

                    <form th:action="@{'/part/delete/' + ${part.partId}}"
                          method="post"
                          onsubmit="return confirm('Delete this part?');">

                        <button class="btn btn-danger action-btn">
                            Delete
                        </button>

                    </form>

                    <a th:href="@{'/wtdocument/part/' + ${part.partId}}"
                       class="btn btn-outline-primary action-btn">
                        Documents
                    </a>

                    <a th:href="@{'/wtdocument/create/' + ${part.partId}}"
                       class="btn btn-primary action-btn">
                        + Add Document
                    </a>

                    <a th:href="@{'/issues/part/' + ${part.partId}}"
                       class="btn btn-dark action-btn">
                        View Issues
                    </a>

                    <a th:href="@{'/issues/create/' + ${part.partId}}"
                       class="btn btn-success action-btn">
                        + Create Issue
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
