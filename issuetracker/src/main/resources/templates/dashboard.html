<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .stat-card {
            transition: 0.2s ease-in-out;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="fw-bold">Dashboard</span>
    <div>
        <a href="/part" class="btn btn-primary btn-sm">Parts</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container py-4">

    <!-- WELCOME -->
    <div class="mb-4">
        <h3>Welcome, <span class="text-primary" th:text="${username}"></span></h3>
        <p class="text-muted">Here’s what’s happening today</p>
    </div>

    <!-- STATS -->
    <div class="row g-3 mb-4">

        <div class="col-md-4">
            <div class="card stat-card shadow-sm p-3">
                <h6 class="text-muted">Total Tasks</h6>
                <h2 th:text="${tasks.size()}"></h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat-card shadow-sm p-3">
                <h6 class="text-muted">Active User</h6>
                <h2 th:text="${username}"></h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat-card shadow-sm p-3">
                <h6 class="text-muted">System Status</h6>
                <h2 class="text-success">Online</h2>
            </div>
        </div>

    </div>

    <!-- TASK LIST -->
    <div class="card shadow-sm p-4">

        <h5 class="mb-3">My Tasks</h5>

        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                th:each="task : ${tasks}">
                <span th:text="${task}"></span>
                <span class="badge bg-primary rounded-pill">Task</span>
            </li>
        </ul>

    </div>

</div>

</body>
</html>
